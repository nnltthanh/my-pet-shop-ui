<nav class="navbar navbar-expand-lg bg-body-tertiary header-height px-3 py-0" [class.expanded]="isExpanded">
  <div class="container-fluid navbar-container py-0 h-100">
    <a class="navbar-brand" href="#">
    <img referrerPolicy="no-referrer" src="/assets/logo.png" alt="Bootstrap" height="50" />
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
      aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse h-100" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0 h-100">
        <li class="nav-item mx-auto">
          <a class="nav-link active" type="button" aria-current="page" routerLink="home">Trang chủ</a>
        </li>
 
        <li class="nav-item mx-auto">
          <a class="nav-link active" type="button" aria-current="page" routerLink="products">Sản phẩm</a>
        </li>

        <li class="nav-item mx-auto">
          <a class="nav-link active" type="button" aria-current="page" routerLink="services">Dịch vụ</a>
        </li>

        <li class="nav-item">
          <a class="nav-link active" aria-current="page" routerLink="/about-us">Giới thiệu</a>
        </li>
      </ul>

      <div class="form form-search">
        <i class="fa fa-search"></i>
        <input type="text" class="form-control form-input" placeholder="Tìm kiếm sản phẩm..." (keydown.enter)="onSearchKeyword($any($event.target).value)" [(ngModel)]="keyword">
        <span class="left-pan" (click)="imageSearch.click()" title="Tìm kiếm bằng hình ảnh"><i class="fa fa-camera" aria-hidden="true"></i></span>
        <input type="file" #imageSearch class="d-none" (change)="onSearch($event.target)"/>
      </div>

      <div routerLink="cart" class="position-relative">
        <span>
          <i class="bi bi-cart2 fs-4 ms-3">
          </i>
        </span>

        @let cartNumber = cartNumber$ | async;

        @if (cartNumber !== null && cartNumber !== undefined && cartNumber > -1) {
          <span class="position-absolute translate-middle badge rounded-pill bg-danger custom-text-sm">
            {{ cartNumber }}
          </span>
        }
      </div>
      <div class="user-control dropdown-user dropdown-toggle" role="button" data-bs-toggle="dropdown-user"
        aria-expanded="true">
        <i class="bi bi-person-circle fs-4 ms-3"></i>
        <ul class="dropdown-menu user-control-menu">
          @if(isLoggedIn()) {
          <li><span class="dropdown-item" routerLink="customer/me/info">Trang cá nhân</span></li>
          <li><span class="dropdown-item" (click)="logout()">Đăng xuất</span></li>
          } @else {
          <li><span class="dropdown-item" (click)="login()">Đăng nhập</span></li>
          }
        </ul>
      </div>
    </div>
  </div>
</nav>
