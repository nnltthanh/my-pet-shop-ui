<div class="row mx-5">
    <div class="col-md-3" style="width: 23%; min-width: 300px">
        <div class="account-sidebar-items position-sticky">
            <div class="avatar">
                <app-avatar-frame class="d-flex" />
            </div>
            @for (item of sidebarItems; track item.imageSrc) {
            <div class="account-sidebar-item" role='button' [class.active]="item.isActive"
                (click)="toggleActive(item.name)">
                <span class="account-option">
                    <img [src]="item.imageSrc" alt="Thông tin tài khoản" style="margin-right: 8px" />
                    <span class="item-label">{{ item.label }}</span>
                </span>
            </div>
            }
        </div>
    </div>
    <div class="col py-0">
        <router-outlet></router-outlet>
    </div>
</div>
