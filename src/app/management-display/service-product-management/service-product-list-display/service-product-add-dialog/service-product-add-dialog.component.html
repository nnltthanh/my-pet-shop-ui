<div class="modal-content address-modal">
  <div class="modal-header" style="z-index: 1">
    <div class="modal-title fs-4" id="exampleModalLabel">Thêm dịch vụ</div>
    <button
      type="button"
      class="btn-close me-3"
      aria-label="Close"
      aria-label="Close"
      (click)="dismissDialog()"
    ></button>
  </div>

  <div class="modal-body" style="z-index: 2">
    <div class="formgrid grid">
      <div class="field col-5">
        <p-fileUpload
          class="text-end h-100"
          chooseIcon="pi pi-upload"
          name="myFile[]"
          uploadLabel=""
          chooseLabel="Tải lên"
          url="./upload.php"
          accept="image/*"
          maxFileSize="5000000"
          [auto]="true"
          progress="none"
          (onSelect)="onSelectImage($event.currentFiles[0])"
          required
        >
          <ng-template
            pTemplate="header"
            let-files
            let-chooseCallback="chooseCallback"
            let-clearCallback="clearCallback"
            let-uploadCallback="uploadCallback"
          >
            <div
              class="flex flex-wrap justify-content-between align-items-center flex-1 gap-2"
            >
              <div class="flex gap-2">
                <p-button
                  (onClick)="choose($event, chooseCallback)"
                  icon="pi pi-cloud-upload"
                  [rounded]="true"
                  [outlined]="true"
                />
                <p-button
                  (onClick)="imageSrc = ''"
                  icon="pi pi-times"
                  [rounded]="true"
                  [outlined]="true"
                  severity="danger"
                  [disabled]="!imageSrc"
                />
              </div>
            </div>
          </ng-template>
          <ng-template let-file pTemplate="file" class="d-none"> </ng-template>
          <ng-template pTemplate="content">
            @if(!imageSrc) {
            <div
              class="flex align-items-center justify-content-center flex-column"
            >
              <i
                class="pi pi-cloud-upload border-2 border-circle p-3 text-4xl text-400 border-400 h-50 mb-3"
              ></i>
              <p class="m-0">Kéo thả hình để tải lên...</p>
            </div>
            } @else {
            <img referrerPolicy="no-referrer"
              [src]="imageSrc"
              class="block m-auto pb-3"
              style="max-width: 300px"
            />
            }
          </ng-template>
        </p-fileUpload>
      </div>
      <div class="field col">
        <p-panel [toggleable]="true" toggler="header">
          <ng-template pTemplate="header" class="cursor-pointer">
            <div class="fs-4 text-blue">Thông tin dịch vụ</div>
          </ng-template>
          <div>
            <div class="formgrid grid mb-3">
              <div class="d-flex flex-column field col">
                <label for="name">Tên dịch vụ </label>
                <input
                  type="text"
                  pInputText
                  id="name"
                  [(ngModel)]="name"
                  required
                  autofocus
                />
              </div>
            </div>
            <div class="formgrid grid mb-3">
              <div class="d-flex flex-column field col">
                <label for="availableServices">Loại dịch vụ</label>
                <p-dropdown
                  [options]="availableServices"
                  [(ngModel)]="selectedService"
                  [filter]="false"
                  class="d-grid"
                />
              </div>
              <div class="d-flex flex-column field col">
                <label for="price"
                  >Giá gốc<span class="text-danger">*</span></label
                >
                <p-inputNumber
                  id="price"
                  [(ngModel)]="price"
                  mode="currency"
                  currency="VND"
                  locale="en-US"
                  required
                  class="d-grid"
                />
              </div>
            </div>

            <div class="field">
              <label for="description">Mô tả</label>
              <p-editor
                id="description"
                [(ngModel)]="description"
                [style]="{ 
              height: '150px', 
              fontFamily: 'Nunito',
            }"
              >
                <ng-template pTemplate="header">
                  <span class="ql-formats">
                    <select class="ql-size"></select>
                  </span>
                  <span class="ql-formats">
                    <button class="ql-bold"></button>
                    <button class="ql-italic"></button>
                    <button class="ql-underline"></button>
                    <button class="ql-strike"></button>
                  </span>
                  <span class="ql-formats">
                    <select class="ql-color"></select>
                    <select class="ql-background"></select>
                  </span>
                  <span class="ql-formats">
                    <button class="ql-blockquote"></button>
                    <button class="ql-link"></button>
                  </span>
                  <span class="ql-formats">
                    <button class="ql-header" value="1"></button>
                    <button class="ql-header" value="2"></button>
                    <button class="ql-header" value="3"></button>
                  </span>
                  <span class="ql-formats">
                    <button class="ql-list" value="ordered"></button>
                    <button class="ql-list" value="bullet"></button>
                    <button class="ql-indent" value="-1"></button>
                    <button class="ql-indent" value="+1"></button>
                  </span>
                  <span class="ql-formats">
                    <button class="ql-direction" value="rtl"></button>
                    <select class="ql-align"></select>
                  </span>
                  <span class="ql-formats">
                    <button class="ql-clean"></button>
                  </span>
                </ng-template>
              </p-editor>
            </div>
          </div>
        </p-panel>
      </div>
    </div>
    <div class="formgrid grid">
      <div class="field col">
        <p-panel>
            <ng-template pTemplate="header" class="cursor-pointer">
              <div class="fs-4 text-blue">Thông tin chi tiết dịch vụ</div>
            </ng-template>
    
            <div class="w-100 my-3 fs-6">
               <table class="w-100 my-3 fs-6">
                <tbody>
                <tr>
                    <!-- <th style="width:20%">Loại thú cưng</th> -->
                    <th style="width:30%">Thuộc tính</th>
                    <th style="width:30%">Giá trị</th>
                    <th style="width:30%">Giá cộng thêm</th>
                    <th style="width:10%"></th>
                </tr>

                @for (item of variants; track $index) {
                    <tr class="mb-2">
                        <!-- <th style="width:20%" class="pe-2">
                            <p-dropdown
                                [options]="availablePets"
                                [(ngModel)]="item.suitableFor"
                                [filter]="false"
                                class="d-grid"
                                />
                        </th> -->
                        <th style="width:30%" class="pe-2">
                            <p-dropdown
                                [options]="availableVariants"
                                [(ngModel)]="item.variantName"
                                [filter]="false"
                                class="d-grid"
                                />
                        </th>
                        <th style="width:30%" class="pe-2">
                            <input
                                type="text"
                                pInputText
                                [(ngModel)]="item.variantValue"
                                class="w-100"
                            />
                        </th>
                        <th style="width:30%" class="pe-2">
                            <p-inputNumber
                                id="price"
                                [(ngModel)]="item.addPrice"
                                mode="currency"
                                currency="VND"
                                locale="en-US"
                                required
                                class="d-grid"
                            />
                        </th>
                        <th style="width:10%" class="pe-2">
                            <p-button
                            icon="pi pi-trash"
                            severity="danger"
                            [rounded]="true"
                            [outlined]="true"
                            (onClick)="deleteVariant($index)"
                        />
                        </th>
                    </tr>
                }
                </tbody>
               </table>

                <div class="d-flex justify-content-center">
                    <div class="btn btn-info border-info" (click)="addRow()">
                        Thêm thông tin
                    </div>
                </div>
            </div>

          </p-panel>
      </div>
    </div>
  </div>

  <div class="modal-footer" style="z-index: 1">
    <button type="button" class="btn-save btn" (click)="save()">Lưu</button>
    <button type="button" class="btn btn-cancel" (click)="dismissDialog()">
      Trở lại
    </button>
  </div>
</div>
